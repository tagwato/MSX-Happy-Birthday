<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário! 🎂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, #ff8fab 0, transparent 30%),
        radial-gradient(circle at 80% 80%, #8ec5ff 0, transparent 30%),
        linear-gradient(135deg, #6a11cb, #2575fc);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #card {
      width: min(90%, 650px);
      padding: 50px 30px;
      text-align: center;
      color: white;

      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .cake {
      font-size: 80px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: clamp(38px, 8vw, 68px);
    }

    p {
      margin: 0 auto 35px;
      max-width: 500px;
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 18px 32px;

      font-size: 20px;
      font-weight: bold;
      color: #333;

      background: white;
      cursor: pointer;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(1px);
    }

    #emulator {
      display: none;
      width: 100vw;
      height: 100vh;
      border: 0;
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>

  <div id="card">
    <div class="cake">🎂</div>

    <h1>Feliz aniversário!</h1>

    <p>
      Preparei uma pequena surpresa para você...<br>
      💾✨
    </p>

    <button id="start">
      ▶ Abrir meu presente
    </button>
  </div>

  <iframe
    id="emulator"
    title="MSX Birthday"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    const button = document.getElementById("start");
    const card = document.getElementById("card");
    const emulator = document.getElementById("emulator");

    // DSK hospedado no próprio repositório GitHub
    const dsk =
      "https://tagwato.github.io/MSX-Happy-Birthday/MSX_Happy_birthday.dsk";

    const webmsx =
      "https://webmsx.org/?" +
      "diska=" + encodeURIComponent(dsk) +
      "&AUTO_START=1" +
      "&SCREEN_FULLSCREEN_MODE=2" +
      "&TOUCH_MODE=3";

    button.addEventListener("click", async () => {

      // Tenta colocar a página inteira em fullscreen
      try {
        await document.documentElement.requestFullscreen();
      } catch (e) {
        // Alguns navegadores podem bloquear o fullscreen.
        // Nesse caso, continuamos normalmente.
      }

      // Esconde o cartão
      card.style.display = "none";

      // Mostra o WebMSX
      emulator.style.display = "block";

      // Só agora carrega o WebMSX, aproveitando o clique do usuário
      emulator.src = webmsx;
    });
  </script>

</body>
</html>
